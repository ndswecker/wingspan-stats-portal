name: wingspan-portal
services:
  django:
    build: .
    container_name: wingspan-django

    depends_on:
      - postgres

    env_file:
      - .env

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development

    volumes:
      - .:/workspace
      - static_data:/workspace/app/staticfiles

    working_dir: /workspace/app

    expose:
      - "8000"

    command: /workspace/docker/entrypoint.sh

    restart: unless-stopped


  postgres:
    image: postgres:17

    container_name: wingspan-postgres

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: wingspan-nginx

    depends_on:
      - django

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/nginx/html/static:ro

    restart: unless-stopped

volumes:
  postgres_data:
  static_data: