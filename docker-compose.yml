name: wingspan-portal
services:
  django:
    build: .
    container_name: wingspan-django

    depends_on:
      - postgres
    env_file:
      - .env

    volumes:
      - .:/workspace

    working_dir: /workspace/app

    ports:
      - "8000:8000"

    command: sleep infinity

    restart: unless-stopped


  postgres:
    image: postgres:17

    container_name: wingspan-postgres

    env_file:
      - .env

    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    restart: unless-stopped

volumes:
  postgres_data: