name: wingspan-portal
services:
  django:
    build: .
    container_name: wingspan-django

    depends_on:
      - postgres

    env_file:
      - .env

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development

    volumes:
      - .:/workspace

    working_dir: /workspace/app

    ports:
      - "8000:8000"

    #command: python manage.py runserver 0.0.0.0:8000
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload

    restart: unless-stopped


  postgres:
    image: postgres:17

    container_name: wingspan-postgres

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    restart: unless-stopped

volumes:
  postgres_data: