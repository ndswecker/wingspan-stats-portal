{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wingspan Stats Portal{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'portal/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'portal/css/site.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                Wingspan Stats Portal
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Games</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Players</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Statistics</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/admin/">Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container py-4 text-muted small">
        Wingspan Stats Portal
    </footer>

    <script src="{% static 'portal/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
