{% extends "portal/base.html" %}

{% block title %}
Login | Wingspan Stats Portal
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h1 class="h3 mb-4">Login</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Invalid username or password.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label
                            class="form-label"
                            for="{{ form.username.id_for_label }}"
                        >
                            Username
                        </label>

                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label
                            class="form-label"
                            for="{{ form.password.id_for_label }}"
                        >
                            Password
                        </label>

                        {{ form.password }}
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
