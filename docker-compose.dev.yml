services:
  django:
    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

    volumes:
      - .:/workspace

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --reload

  postgres:
    env_file:
      - .env

    ports:
      - "5432:5432"

  nginx:
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/nginx/html/static:ro